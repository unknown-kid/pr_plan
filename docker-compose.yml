version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: paper-reader-db
    environment:
      POSTGRES_DB: paper_reader
      POSTGRES_USER: paperuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperuser -d paper_reader"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paper-reader-network

  redis:
    image: redis:7-alpine
    container_name: paper-reader-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paper-reader-network

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: paper-reader-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - paper-reader-network

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: paper-reader-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - paper-reader-network

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: paper-reader-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - paper-reader-network

  backend:
    build:
      context: ./backend
    container_name: paper-reader-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://paperuser:${DB_PASSWORD:-password}@postgres:5432/paper_reader
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-secret}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    networks:
      - paper-reader-network

  celery-worker:
    build:
      context: ./backend
    container_name: paper-reader-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://paperuser:${DB_PASSWORD:-password}@postgres:5432/paper_reader
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    networks:
      - paper-reader-network

  frontend:
    build:
      context: ./frontend
    container_name: paper-reader-frontend
    networks:
      - paper-reader-network

  nginx:
    image: nginx:alpine
    container_name: paper-reader-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - paper-reader-network

volumes:
  postgres_data:
  milvus_data:
  milvus_etcd_data:
  milvus_minio_data:

networks:
  paper-reader-network:
    driver: bridge
